name: layout-invariants

# בדיקות נכונות עצמאיות ל-RED: מסלול חי, בדיקות גיאומטריה וקורפוס גדול.
# P6/P7 וההשוואה ל-PDF ההיסטורי הוקפאו לחלוטין לפי הוראת המשתמש (10.11.2026).
# לכן אין חילוץ PDF, אין compare.py ואין יצירת score/דוח legacy ב-workflow זה.

on:
  push:
    branches: [ main, UNIFIED ]
  pull_request:
    branches: [ main, UNIFIED ]
  workflow_dispatch:

jobs:
  layout-parity:
    runs-on: ubuntu-latest
    # **S5.2 (P-11):** תקרה מפורשת לכל job — בלי זה ריצה תקועה מחזיקה ראנר
    # עד חיתוך ברירת המחדל של GitHub (360 דק').
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Run RED through the live path (IMUD defaults + real font → model + PDF)
        run: node tools/layout-parity/run-ours.js


      - name: Always upload the independent RED model + PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-invariants-report
          path: |
            audits/layout-parity-artifacts/ours-model.json
            audits/layout-parity-artifacts/ours.pdf
          if-no-files-found: warn

  # D-100: audits/very_long_test_text.txt (363K מילים) מכיל מקור פגום ולכן נשמר
  # כ-negative control: ה-CLI חייב לאשר שהוא נדחה לפני מדידה/עימוד.
  # לבדיקת עומס מלאה משתמשים בקובץ הגדול ביותר שעובר D-100:
  # audits/long_test_text.txt — 291,719 מילים, כ-1,038 עמודים בריצת DP.
  # כך אין תיקון או המצאת תוכן בקורפוס ההיסטורי, ובכל זאת נשמרת בדיקת עומס
  # רצינית על מקור תקין: C1 שימור · C2 חפיפות · C3 גבולות · C9 כותרות ·
  # C10 הערות · C11 PDF · C12 HTML; C4–C8 נשארים מידעיים לפי D-99.
  # הדוח והספר המיוצא (PDF+HTML) נשמרים כ-artifact.
  very-long-corpus:
    runs-on: ubuntu-latest
    # **S5.2 (P-11):** תקרה מפורשת — כמו בכל שאר ה-jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyMuPDF (חילוץ גיאומטריה מ-PDF)
        run: pip install pymupdf==1.26.7

      - name: D-100 negative control — malformed 363K source must be rejected
        run: node tools/validate-source-structure.js audits/very_long_test_text.txt --expect-invalid

      - name: Validate largest structurally valid stress corpus
        run: node tools/validate-source-structure.js audits/long_test_text.txt

      - name: Run RED on the largest valid corpus (live path + deterministic double-run + HTML)
        run: node tools/layout-parity/run-ours.js audits/long_test_text.txt audits/very-long-artifacts --determinism --html

      - name: Independent corpus invariants (C1..C12 — כולל ייצוא HTML)
        run: |
          python3 tools/layout-parity/verify-corpus.py \
            audits/long_test_text.txt \
            audits/very-long-artifacts/ours-model.json \
            audits/very-long-artifacts/ours.pdf \
            audits/very-long-artifacts/corpus-report.json \
            audits/very-long-artifacts/ours.html

      - name: Always upload the corpus report + the exported book
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: largest-valid-corpus-report
          path: |
            audits/very-long-artifacts/corpus-report.json
            audits/very-long-artifacts/ours-model.json
            audits/very-long-artifacts/ours.html
            audits/very-long-artifacts/ours.pdf
          if-no-files-found: warn
